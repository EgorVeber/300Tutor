plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.v_points.app'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        applicationId "com.v_points.app"
        buildConfigField "String", "BASE_URL", "\"https://app.mega-academy.online\""
        buildConfigField "Boolean", "CHANGE_DOMAIN", "true"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig = true
        viewBinding true
        compose = true
    }
}
apply from: "../dependencies.gradle"
dependencies {
    //Default
    implementation "androidx.core:core-ktx:$versions.corektx"
    implementation "androidx.appcompat:appcompat:$versions.appcompat"
    implementation "com.google.android.material:material:$versions.material"
    implementation "androidx.constraintlayout:constraintlayout:$versions.constraintlayout"

    //Coil PhotoView
    implementation "io.coil-kt:coil:$versions.coil"
    implementation "com.github.chrisbanes:PhotoView:$versions.photoView"

    //Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$versions.lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$versions.lifecycle"


    //Retrofit
    implementation "com.squareup.retrofit2:retrofit:$versions.retrofit2"
    implementation "com.squareup.retrofit2:converter-gson:$versions.retrofit2"
    implementation "com.squareup.okhttp3:okhttp:$versions.okhttp"
    implementation "com.squareup.okhttp3:logging-interceptor:$versions.okhttpLogging"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:$versions.okhttpUrlconnection"

    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:$versions.coroutineAdapter"

    //Room
    implementation "androidx.room:room-runtime:$versions.room"
    implementation "androidx.room:room-ktx:$versions.room"
    kapt "androidx.room:room-compiler:$versions.room"

    //Dagger
    implementation "com.google.dagger:dagger:$versions.dagger"
    kapt "com.google.dagger:dagger-compiler:$versions.dagger"

    //Fragment ktx
    implementation "androidx.fragment:fragment-ktx:$versions.ktxFragment"

    //navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$versions.navigation"
    implementation "androidx.navigation:navigation-ui-ktx:$versions.navigation"

    //DelegateAdapter
    implementation "com.hannesdorfmann:adapterdelegates4-kotlin-dsl-viewbinding:$versions.adapterdelegates"

    //Jsoup
    implementation "org.jsoup:jsoup:$versions.jsoup"

    androidTestImplementation("com.kaspersky.android-components:kaspresso:$versions.kaspresso")
    androidTestUtil("androidx.test:orchestrator:$versions.orchestrator")

    androidTestImplementation "org.hamcrest:hamcrest:$versions.hamcrest"
    implementation "androidx.test.ext:junit-ktx:$versions.junitktx"

    implementation "ir.mahozad.android:pie-chart:$versions.piechart"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$versions.swiperefreshlayout"
    implementation "androidx.security:security-crypto:$versions.securitycrypto"
    implementation project(":ui_common")
    implementation project(":ui_core")


    // 1. Compose BOM: унифицированное управление версиями всех библиотек Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.06.01')
    implementation composeBom
    androidTestImplementation composeBom

    // 2. Базовые библиотеки Compose (BOM не добавляет их автоматически, необходимо объявить явно)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")


    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
}